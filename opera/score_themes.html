<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elena: Themes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.4.4/abcjs-basic-min.js"></script>
<style>
  :root {
    --bg: #f6f1e7; --paper: #fffdf8; --ink: #1d1712; --muted: #6b5d4f; --rule: #d8ccb8;
    --crimson: #8e1022; --gold: #9a6a1c; --steel: #3d5a8a; --green: #2f7a62; --silver: #6f7a8a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #120e0b; --paper: #1b1612; --ink: #efe6d8; --muted: #a8998a; --rule: #3a3029;
      --crimson: #d4424f; --gold: #d9a84a; --steel: #8fb0e6; --green: #6fc6a6; --silver: #b8c2d0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #120e0b; --paper: #1b1612; --ink: #efe6d8; --muted: #a8998a; --rule: #3a3029;
    --crimson: #d4424f; --gold: #d9a84a; --steel: #8fb0e6; --green: #6fc6a6; --silver: #b8c2d0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.55 "EB Garamond", Georgia, serif; }
  main { max-width: 980px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font-family: "Bodoni Moda", serif; font-weight: 400; letter-spacing: .32em; text-transform: uppercase;
       font-size: clamp(34px, 7vw, 64px); margin: 0; text-align: center; }
  .sub { text-align: center; font-style: italic; color: var(--muted); margin: 6px 0 40px; }
  section { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 22px 22px 10px;
            margin: 0 0 26px; }
  h2 { font-family: "Bodoni Moda", serif; font-weight: 600; font-size: 22px; margin: 0 0 4px; }
  h2 .tag { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 10px;
            vertical-align: 2px; }
  p { margin: 6px 0 12px; color: var(--muted); }
  .score { overflow-x: auto; }
  .score svg { max-width: 100%; height: auto; }
  .score svg path, .score svg text { fill: var(--ink); }
  .score svg .abcjs-staff, .score svg .abcjs-staff-extra { stroke: var(--ink); }
  pre { white-space: pre-wrap; font-size: 13px; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 15px; margin-top: 30px; }
</style>
</head>
<body>
<main>
  <h1>Elena</h1>
  <div class="sub">tragedia lirica in tre atti: the governing themes</div>
  <div id="themes"></div>
  <footer>Composed first, as the treatment requires; all other music grows from these.</footer>
</main>
<script>
const THEMES = [
  { title: "The wedding melody, “Sia per sempre”", colour: "--gold",
    note: "D major, 6/8, tempo di furlana. Returns in F minor beneath the Stabat Mater and, untouched, in D♭ under the final aria.",
    abc: "X:1\nM:6/8\nL:1/8\nQ:3/8=66\nK:D\nF2G A2d | c2B A2F | G2A B2e | d2c B2A | F2G A2d | f2e d2B | B2c d2B | A d2 c2 d |\nw: Suo-nin le cam-pa-ne~a fe-sta cor-ra~il vi-no per la vi-a fio-ri bian-chi sul-la te-sta Dio vi guar-di~e co-sì si-a\nA2d a2g | f2e d2c | B2c d2e | f2g a3 | A2d b2a | g2f e2d | f2e d2B | A2c d3 |]\nw: Sia per sem-pre sia per sem-pre ciò che~il cie-lo~in ter-ra~u-nì sia per sem-pre sia per sem-pre sia per sem-pre~il vo-stro sì\n" },
  { title: "Vittorio’s phrase (identical on every appearance)", colour: "--steel",
    note: "A♭ major, 4/4. Only the words descend: husband, parasite, ruin. The accompaniment thins to nothing.",
    abc: "X:2\nM:4/4\nL:1/8\nQ:1/4=80\nK:Ab clef=bass\nC3 B, A,2 G,2 | {D}C3 A, E2 D2 | D2 C2 B,3 A, | G, A, F,4 E,2 |\nw: È-le-na sei mia per sem-pre Io nel cuo-re ti ri-man-go\nE, A, C4 E2 | D2 E2 F3 E | D2 C2 B,3 C | D2 B,2 G,2 A,2 |]\nw: Nes-sun luo-go ti na-scon-de dal tuo spo-so tuo si-gno-re\n" },
  { title: "Marco’s motif, “Ti scriverò”", colour: "--green",
    note: "It hangs on the fourth degree every time… and resolves only when his letter arrives, in G♭, after the A has gone.",
    abc: "X:3\nM:4/4\nL:1/8\nK:G\nD | B3 A c4- | c4 z4 |]\nw: Ti scri-ve-rò\n" },
  { title: "Tommaso’s tone", colour: "--silver",
    note: "A4 = 440 Hz: a cello harmonic. The oboe’s tuning note, the film’s first sound. His death is its absence.",
    abc: "X:4\nM:none\nL:1/1\nK:C\n!fermata!A |]\n" },
  { title: "Davide’s music", colour: "--crimson",
    note: "F major, plain, settled: a home. After the child’s death his F loses its third.",
    abc: "X:5\nM:4/4\nL:1/16\nK:F clef=bass\nC,2D,2 F,3E, F,2G,2 A,2G,2 | A,2G,2 F,3E, D,2E,2 D,2C,2 |\nw: non co-no-sco le pa-ro-le dei po-e-ti~e dei te-no-ri\n" },
];
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
const root = document.getElementById("themes");
THEMES.forEach((t, i) => {
  const s = el("section");
  const h = el("h2");
  const dot = el("span", "tag");
  dot.style.background = `var(${t.colour})`;
  h.append(dot, document.createTextNode(t.title));
  const p = el("p", null, t.note);
  const box = el("div", "score");
  box.id = "abc" + i;
  s.append(h, p, box);
  root.append(s);
  if (window.ABCJS) {
    ABCJS.renderAbc(box.id, t.abc, { responsive: "resize", add_classes: true, paddingtop: 6, paddingbottom: 6 });
  } else {
    box.append(el("pre", null, t.abc));
  }
});
</script>
</body>
</html>
